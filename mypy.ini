# mypy configuration for Tailscale-Headscale-Client.
#
# Invocation-agnostic: the same result whether you run a single file, the src/
# tree, or the whole project from any working directory (IDE plugins included).

[mypy]
python_version = 3.12

# Top-level packages are `src`, `tests` and `scripts`, so the repo root is the
# import root. Setting it explicitly (relative to this file) plus
# explicit_package_bases stops mypy from inferring the root from whichever
# files happen to be passed in — without this, an IDE analyzing a file under
# src/ can infer `src` itself as the root and then fail with:
#   Cannot find module `src.core.tailscale`
mypy_path = .
explicit_package_bases = True

# Generated/derived trees and caches are never analyzed. Single-line regex:
# mypy's INI parser does not support multi-line values.
exclude = (?x)(^|/)(build|dist|temp_data|\.mypy_cache|\.pytest_cache|\.ruff_cache|__pycache__)/

warn_return_any = false
warn_unused_configs = true

# Third-party packages without type stubs or py.typed markers
[mypy-qt_material.*]
ignore_missing_imports = True

[mypy-deep_translator.*]
ignore_missing_imports = True
